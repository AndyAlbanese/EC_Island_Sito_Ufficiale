<!DOCTYPE html>
<html lang="it">
<head>
    <link href="css/style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC Island Sito Ufficiale | ecisland.it</title>
     <!--EC = Esordienti Calcistici (eFootball e FC27), ISLAND perche' e' nata nell'isola d'elba, il 10 agosto 2019-->
</head>
<body>

    <div class="logo-title">
        <img src="img/logo.png" alt="Logo della squadra" class="immagine">
        <h1>EC Island</h1>
    </div>

    <nav class="navabarra">
        <ul class="navbar">
            <li>
                <a href="index.html">Presentazione</a>
            </li>
            <li>
                <a href="roster.html">Roster</a>
            </li>
            <li>
                <a href="merch.html">Merchandising</a>
            </li>
            <li>
                <a href="calendario.html">Calendario Partite</a>
            </li>
            <li>
                <a href="sponsor.html">Sponsor</a>
            </li>
            <li>
                <a href="contatti.html">Contatti</a>
            </li>
        </ul>
    </nav>


    <div class="card">
    <h2>Inserisci le tue informazioni per tenerci in contatto:</h2>

    <!-- FORM DI REGISTRAZIONE -->
    <form id="registrationForm">
        <div class="form-group">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" required placeholder="Inserisci il tuo nome">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="esempio@email.com">
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required placeholder="Scegli una password">
        </div>

        <button type="submit">Invia</button>
    </form>

    <!-- Messaggio di conferma a schermo -->
    <div id="messaggio"></div>
</div>

<script>
    // Selezioniamo il form e il div per il messaggio
    const form = document.getElementById('registrationForm');
    const messaggio = document.getElementById('messaggio');

    // Ascoltiamo l'evento di invio del modulo
    form.addEventListener('submit', function(event) {
        // Evitiamo che la pagina si ricarichi (comportamento predefinito dell'HTML)
        event.preventDefault();

        // 1. Qui in futuro potrai inserire il codice per inviare i dati a un server (es. con fetch)

        // 2. Mostriamo un messaggio di successo all'utente
        messaggio.textContent = "Registrazione effettuata con successo!";

        // 3. Svuotiamo tutti i campi del form
        form.reset();

        // Facoltativo: nasconde il messaggio di successo dopo 4 secondi
        setTimeout(() => {
            messaggio.textContent = '';
        }, 4000);
    });
</script>

</body>
</html>
